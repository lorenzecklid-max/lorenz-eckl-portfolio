          - label: "The Result"
            name: "result"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body text (black)", name: "bodyBlack", widget: "text" }
              - { label: "Body text (grey)", name: "bodyMuted", widget: "text" }

      - file: "content/projects/terra.json"
        label: "Terra"
        name: "terra"
        fields:
